<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Dorkar</title>
<meta name="theme-color" content="#1D4ED8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
:root{
  --primary:#1D4ED8;--primary-h:#1E40AF;--primary-soft:#DBEAFE;--link:#1D4ED8;
  --bg:#F8FAFC;--surface:#FFFFFF;--border:#E2E8F0;--text:#0F172A;--muted:#64748B;
  --ok:#15803D;--ok-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#DC2626;--bad-soft:#FEE2E2;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --r8:8px;--r12:12px;--r16:16px;--fx:'Noto Sans Bengali';color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#2563EB;--primary-h:#1D4ED8;--primary-soft:#172554;--link:#60A5FA;
    --bg:#0B1220;--surface:#111A2E;--border:#23314D;--text:#E6ECF5;--muted:#93A3BD;
    --ok:#4ADE80;--ok-soft:#052E16;--warn:#FBBF24;--warn-soft:#3B2A06;--bad:#F87171;--bad-soft:#450A0A;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#2563EB;--primary-h:#1D4ED8;--primary-soft:#172554;--link:#60A5FA;
  --bg:#0B1220;--surface:#111A2E;--border:#23314D;--text:#E6ECF5;--muted:#93A3BD;
  --ok:#4ADE80;--ok-soft:#052E16;--warn:#FBBF24;--warn-soft:#3B2A06;--bad:#F87171;--bad-soft:#450A0A;
  --shadow:none;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 'Inter',var(--fx),'Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:20px;line-height:1.25}h2{font-size:17px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mut{color:var(--muted);font-size:13px}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:6px 18px;border-radius:var(--r8);border:1px solid var(--border);background:var(--surface);font-weight:600;white-space:normal;text-align:center;line-height:1.25;max-width:100%;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn.block{width:100%;min-height:52px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:var(--r8);color:inherit}
.ib:hover{background:var(--primary-soft)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

/* forms */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r8)}
textarea{min-height:88px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;margin-bottom:8px}
.chk input{width:22px;height:22px;min-height:22px;padding:0}
.search{position:relative;margin-bottom:12px}
.search input{padding-inline-start:44px}
.search .si{position:absolute;inset-inline-start:12px;top:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.fchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;white-space:nowrap}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* cards, chips, rows */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);padding:16px;margin-bottom:12px}
.card>h2,.card>h3{margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.grid>.card{margin-bottom:0}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:20px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.kpi.bad b{color:var(--bad)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pri{background:var(--primary-soft);color:var(--link)}
.chip.muted{background:var(--border);color:var(--muted)}
.chip.void{background:var(--border);color:var(--muted);text-decoration:line-through}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);margin-bottom:8px;text-align:start}
button.row:hover{border-color:var(--primary)}
.row .r1{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.row .r2{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{color:var(--text);margin:8px 0 4px}
.empty .btn{margin-top:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--link);border-bottom-color:var(--primary)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv.tot{font-weight:700;font-size:17px;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.warn-t{color:var(--warn);font-size:12px}
.bad-t{color:var(--bad)}
.tw{overflow-x:auto}
.lt{width:100%;border-collapse:collapse}
.lt th,.lt td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:start;font-size:14px;vertical-align:top}
.lt th{font-size:12px;color:var(--muted);font-weight:600}
.lt .num{text-align:end;white-space:nowrap}
.chart{width:100%;height:auto;max-height:260px;display:block}

/* app shell */
.side{position:fixed;inset-block:0;inset-inline-start:0;width:240px;background:var(--surface);border-inline-end:1px solid var(--border);padding:20px 12px;display:none;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 8px 16px}
.logo{width:32px;height:32px;border-radius:var(--r8);background:var(--primary);color:#fff;display:inline-grid;place-items:center}
.logo .i{width:18px;height:18px}
.nl{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:var(--r8);background:none;font-weight:500;width:100%;text-align:start}
.nl:hover{background:var(--primary-soft)}
.nl.on{background:var(--primary-soft);color:var(--link);font-weight:600}
.grow{flex:1}
.main{min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:60px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--border)}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:8px;align-items:center}
.content{padding:16px 16px 100px;max-width:1100px;margin:0 auto}
.nonav .content{padding-bottom:24px}
.bnav{position:fixed;inset-inline:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted)}
.bnav button.on{color:var(--link)}
@media(min-width:700px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.hide-d{display:none}}
@media(max-width:699px){.grid.g5{grid-template-columns:1fr 1fr}.grid.g5>.card:first-child{grid-column:1/-1}}
@media(min-width:900px){.side{display:flex}.main{margin-inline-start:240px}.bnav{display:none}.content{padding:24px 32px 48px}}

/* editor */
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);margin-bottom:8px}
.prow.sel{border-color:var(--primary)}
.prow .pi{display:flex;flex-direction:column;min-width:0}
.step{display:flex;align-items:center;gap:4px}
.step .ib{border:1px solid var(--border);width:40px;height:40px;font-size:20px;font-weight:600}
.qn{min-width:28px;text-align:center;font-weight:700}
.bar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);padding:12px 16px;margin-top:12px;box-shadow:var(--shadow)}
.bar .btn.primary{min-width:130px}

/* invoice paper */
.paper{--border:#E2E8F0;--muted:#64748B;--text:#0F172A;background:#fff;color:#0F172A;border:1px solid var(--border);border-radius:var(--r12);padding:24px;margin-bottom:12px;position:relative}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.ph .pb{flex:1;min-width:0;display:block}
.ph .phr{flex:none;text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pno{display:block;font-size:16px;font-weight:600;color:#1D4ED8;white-space:nowrap;line-height:1.3}
.pm>div:last-child{text-align:end}
.ptitle{font-size:22px;font-weight:700;color:#1D4ED8;line-height:1.2}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.pm span.mut{display:block}
.ptot{margin-inline-start:auto;max-width:300px;margin-top:12px}
.stamp{display:inline-block;border:2px solid #DC2626;color:#DC2626;font-weight:700;padding:2px 10px;border-radius:6px;margin-top:6px;transform:rotate(-4deg)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;border-radius:var(--r16) var(--r16) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:var(--r16)}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 20px;border-bottom:1px solid var(--border)}
.sh-b{padding:16px 20px;overflow:auto}
.sh-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90%;font-size:14px;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* onboarding + website */
.onb{display:flex;justify-content:center;padding:5vh 16px 24px}
.ob{width:100%;max-width:460px;padding:24px}
.ob h1{margin:8px 0 4px;font-size:22px}
.site{max-width:1100px;margin:0 auto;padding:0 20px}
.snav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.snav .brand{padding:0}
.hero{display:grid;gap:32px;padding:40px 0 56px;align-items:center}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.1;letter-spacing:-.02em;max-width:16ch}
.hero p{font-size:18px;color:var(--muted);margin:16px 0 24px;max-width:46ch}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.mock{background:#fff;color:#0F172A;border:1px solid #E2E8F0;border-radius:var(--r16);padding:20px;box-shadow:0 20px 50px rgba(29,78,216,.15);max-width:420px;width:100%;justify-self:center}
.mock .mk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mock .mk-l{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #E2E8F0;font-size:14px}
.mock .mk-t{display:flex;justify-content:space-between;padding-top:12px;font-weight:700;font-size:18px}
@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr}}
.sec{padding:32px 0}
.sec>h2{font-size:26px;margin-bottom:20px}
.feat .i{color:var(--link);width:26px;height:26px;margin-bottom:8px}
.feat p{color:var(--muted);font-size:14px;margin-top:4px}
details{background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);padding:14px 16px;margin-bottom:8px}
summary{font-weight:600;cursor:pointer}
details p{color:var(--muted);margin-top:8px}
.sfoot{padding:32px 0 48px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:24px}

.thumb{width:56px;height:56px;border-radius:var(--r8);object-fit:cover;border:1px solid var(--border)}
.thumb[hidden]{display:none}
.imgf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imgf input[type=file]{flex:1;min-width:0;min-height:44px;padding:8px}
.pt{width:44px;height:44px;border-radius:var(--r8);object-fit:cover;background:var(--primary-soft);color:var(--link);display:inline-grid;place-items:center;flex:none}
.rl{display:flex;gap:12px;align-items:center;min-width:0}
.plogo{display:block;max-height:64px;max-width:200px;object-fit:contain;margin-bottom:6px}
.pb{display:flex;gap:14px;align-items:center}
.pband{height:6px;background:#1D4ED8;border-radius:6px 6px 0 0;margin:-24px -24px 20px}
.wm{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;font-weight:800;letter-spacing:.05em;opacity:.06;transform:rotate(-18deg);pointer-events:none;overflow:hidden}
.wm.bad{color:#DC2626}.wm.ok{color:#16A34A}
.pfoot{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-top:20px;flex-wrap:wrap}
.qrb{display:flex;flex-direction:column;align-items:center;gap:4px}
.qr{width:128px;height:128px;border:1px solid var(--border)}
.vbox{max-width:520px;margin:16px auto}
.vok{border-color:var(--ok)}.vbad{border-color:var(--bad)}
.posgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.posgrid{grid-template-columns:1.5fr 1fr;align-items:start}.posgrid .cartp{position:sticky;top:76px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);text-align:start;min-height:120px}
.tile:hover{border-color:var(--primary)}
.tile .pt{width:100%;height:64px;border-radius:var(--r8);object-fit:cover}
.tile b{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.tile[disabled]{opacity:.45;cursor:not-allowed}
.cline{padding:10px 0;border-bottom:1px solid var(--border)}
.cline .cl2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.rcpt{--border:#E2E8F0;--muted:#64748B;background:#fff;color:#0F172A;max-width:340px;margin:0 auto 12px;padding:20px;border:1px solid #E2E8F0;border-radius:12px;font-size:13px}
.rcpt hr{border:0;border-top:1px dashed #94A3B8;margin:10px 0}
.rcpt .rl2{display:flex;justify-content:space-between;gap:8px}
.rcpt .c{text-align:center}
.rcpt img.rlogo{display:block;max-height:56px;max-width:160px;margin:0 auto 6px}
.adm{padding-bottom:48px}
.adm .tabs{margin-top:8px}
/* responsive hardening */
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap}
html{-webkit-text-size-adjust:100%}
img,svg,video{max-width:100%}
input,select,textarea{font-size:16px}
.snav{flex-wrap:wrap;gap:8px 12px}
.snav .brand{white-space:normal;min-width:0;flex:1 1 auto}
.snav .acts{margin-inline-start:auto;flex-wrap:wrap;justify-content:flex-end}
.top{flex-wrap:wrap}
.top h1{flex:1 1 auto;min-width:0;max-width:100%}
.top .acts{margin-inline-start:auto}
.lgn{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgc{display:none}
@media(max-width:520px){.lgn{display:none}.lgc{display:inline}.snav .acts .btn{padding:0 12px}}
@media(max-width:899px){.app:not(.nonav) .bar{bottom:calc(62px + env(safe-area-inset-bottom,0px))}}
@media(min-width:900px){.only-m{display:none}}
@media(max-width:699px){.grid.g5>.card:last-child{grid-column:1/-1}.grid.kpis{grid-template-columns:repeat(3,1fr);gap:8px}.kpis .kpi{padding:10px}.kpis .kpi b{font-size:15px}.grid.kp2{grid-template-columns:1fr 1fr}}
[dir="rtl"] .top>.ib .i,[dir="rtl"] .flip{transform:scaleX(-1)}
@media(max-width:520px){.snav .acts .btn{min-height:36px;font-size:14px;padding:4px 12px}}
.bnav button{min-width:0}
.bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.brand span{min-width:0;overflow-wrap:anywhere}
.sellerbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:12px;background:var(--primary-soft);border-radius:var(--r8);font-size:14px}
.stockcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;cursor:pointer}
.stockcard:hover{border-color:var(--primary)}
.stockcard .sc-h{display:flex;justify-content:space-between;align-items:center}
.stockcard .kv{padding:2px 0}
.stockcard .sc-f{margin-top:auto;padding-top:4px}
.stockcard.low{border-inline-start:4px solid var(--warn)}
.stockcard.out{border-inline-start:4px solid var(--bad)}
.warn-t2{color:var(--warn);font-weight:700}
.grid.stk{grid-template-columns:1fr 1fr}
.stockcard .kv{gap:6px;font-size:14px}
.stockcard .kv>span:first-child{min-width:0;overflow-wrap:anywhere}
@media(max-width:420px){.stockcard{padding:12px}.stockcard .kv{font-size:13px}}
.adminbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:12px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r8);font-size:14px}
.scanbox{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r12);background:#000;overflow:hidden}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanspin{position:absolute;inset:0;display:grid;place-items:center}
.scanspin::after{content:'';width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scanman{margin-top:4px}
.scanman>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.scanman-row{display:flex;gap:8px}
.scanman-row input{flex:1;min-width:0}
@media print{
  .side,.top,.bnav,.noprint,#toast,#modal{display:none!important}
  .main{margin:0!important}.content{padding:0!important;max-width:none}
  .paper{border:0!important;box-shadow:none!important;padding:0}
  body{background:#fff}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="modal2"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Please enable JavaScript to use Invoice Dorkar.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>

/* ---------- Firebase (Auth + a lightweight user-profile collection) ---------- */

let fb=null;
const FB_READY=(async()=>{
  try{
    const V='10.13.2';
    const [core,authMod,fsMod]=await Promise.all([
      import(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-app.js`),
      import(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-auth.js`),
      import(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-firestore.js`)
    ]);
    const app=core.initializeApp(FB_CONFIG);
    fb={app,auth:authMod.getAuth(app),db:fsMod.getFirestore(app),A:authMod,F:fsMod};
    return true;

})();
async function ensureFB(){if(!(await FB_READY)){toast(t('fbFail'));return null}return fb}
function authErr(e){

}
async function pushProfile(u,fields){const F=await ensureFB();if(!F)return;try{await F.F.setDoc(F.F.doc(F.db,'users',u.id),fields,{merge:true})}catch(e){toast(t('fbFail'))}}
const pushTimers={};
function scheduleCloudSave(){
  const u=curUser();if(!u)return;
  const uid=u.id,snap=S;
  clearTimeout(pushTimers[uid]);
  pushTimers[uid]=setTimeout(()=>{delete pushTimers[uid];pushDataFor(uid,snap)},900);
}
async function pushDataFor(uid,dataObj){
  const F=await ensureFB();if(!F)return false;
  try{await F.F.setDoc(F.F.doc(F.db,'businessData',uid),Object.assign({},dataObj,{savedAt:Date.now()}));return true}catch(e){return false}
}
async function pullDataFor(uid){
  const F=await ensureFB();if(!F)return null;
  try{const snap=await F.F.getDoc(F.F.doc(F.db,'businessData',uid));return snap.exists()?snap.data():null}catch(e){return null}
}
async function deleteDataFor(uid){
  const F=await ensureFB();if(!F)return;
  try{await F.F.deleteDoc(F.F.doc(F.db,'businessData',uid))}catch(e){}
}
async function wireAuth(){
  const F=await ensureFB();
  if(!F){ADMIN_OK=false;render();return}
  F.A.onAuthStateChanged(F.auth,async user=>{
    if(!user){ROOT.session=null;detach();ADMIN_OK=false;render();return}
    let prof=null;
    try{const snap=await F.F.getDoc(F.F.doc(F.db,'users',user.uid));prof=snap.exists()?snap.data():null}catch(e){}
    if(!prof){
      prof={name:user.displayName||user.email,email:user.email,plan:'free',subOn:false,until:'',suspended:false,created:Date.now(),lastLogin:Date.now()};
      try{await F.F.setDoc(F.F.doc(F.db,'users',user.uid),prof)}catch(e){}
    }
    if(prof.suspended){toast(t('suspendedMsg'));try{await F.A.signOut(F.auth)}catch(e){}ROOT.session=null;detach();ADMIN_OK=false;render();return}
    let u=ROOT.users.find(x=>x.id===user.uid);
    if(!u){u=Object.assign({id:user.uid},prof);ROOT.users.push(u)}else Object.assign(u,prof);
    u.lastLogin=Date.now();
    try{await F.F.setDoc(F.F.doc(F.db,'users',user.uid),{lastLogin:u.lastLogin},{merge:true})}catch(e){}
    ROOT.session={uid:user.uid};attach(user.uid);
    ADMIN_OK=(user.email===ADMIN_EMAIL);
    render();
    try{const snap=await F.F.getDoc(F.F.doc(F.db,'businessData',user.uid));
      if(snap.exists()){S=snap.data();ROOT.data[user.uid]=S;try{localStorage.setItem(KEY,JSON.stringify(ROOT))}catch(e){}render()}
    }catch(e){}
    if(ADMIN_OK){
      try{const qs=await F.F.getDocs(F.F.collection(F.db,'users'));ROOT.users=qs.docs.map(d=>Object.assign({id:d.id},d.data()));save()}catch(e){}
    }
  });
}

    const net=af[i]-sh,b=l.taxBps||0;
    let tax,total;
    if(inc){tax=net-Math.round(net*10000/(10000+b));total=net}else{tax=mulBps(net,b);total=net+tax}
    return Object.assign({},l,{discMinor:ld[i]+sh,netMinor:net,taxMinor:tax,totalMinor:total});
  });
  return{lines:out,subtotal:sum(gr,x=>x),discountTotal:sum(out,l=>l.discMinor),taxTotal:sum(out,l=>l.taxMinor),grandTotal:sum(out,l=>l.totalMinor)};
}

function wedge(e){
  const tg=e.target,tag=tg&&tg.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(tg&&tg.isContentEditable)||e.ctrlKey||e.metaKey||e.altKey)return;

function imgResize(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.85))};
    im.onerror=()=>toast(t('imgFail'));im.src=r.result};
  r.onerror=()=>toast(t('imgFail'));r.readAsDataURL(file);
}

function buildInv(e,status,date){
  const c=calc(e.lines,discOf(e),S.biz.taxInc),cu=S.customers.find(x=>x.id===e.cust),b=S.biz;
  return{id:e.id||uid(),status,number:null,date:date||today(),due:e.due,
    business:{name:b.name||t('myBiz'),address:b.address||'',phone:b.phone||'',email:b.email||'',taxId:b.taxId||'',taxIdLabel:b.taxIdLabel||t('taxId'),logo:b.logo||'',footer:b.footer||'',currency:b.currency,country:b.country},
    customer:cu?{id:cu.id,name:cu.name,phone:cu.phone||'',address:cu.address||'',taxId:cu.taxId||''}:{id:'',name:t('walkin'),phone:'',address:'',taxId:''},
    taxInc:!!b.taxInc,taxName:b.taxName||'Tax',invTitle:b.invTitle||'Invoice',seller:sellerRef(),
    lines:c.lines.map(l=>({pid:l.pid,name:l.name,sku:l.sku,unit:l.unit,qty:l.qty,priceMinor:l.priceMinor,costMinor:l.costMinor,taxBps:l.taxBps,track:l.track,dt:l.dt||'fix',dv:l.dv||'',discMinor:l.discMinor,netMinor:l.netMinor,taxMinor:l.taxMinor,totalMinor:l.totalMinor})),
    dt:e.dt,dv:e.dv,subtotal:c.subtotal,discountTotal:c.discountTotal,taxTotal:c.taxTotal,grandTotal:c.grandTotal,notes:e.notes||'',created:Date.now()};
}
function putInv(inv){const k=S.invoices.findIndex(x=>x.id===inv.id);if(k>=0){inv.created=S.invoices[k].created;inv.counted=S.invoices[k].counted;S.invoices[k]=inv}else S.invoices.push(inv)}
function issue(e,date,skipStock,noCount){
  if(!e.lines.length){toast(t('addItems'));return null}
  const ex=e.id?invById(e.id):null;
  if(!(ex&&ex.counted)&&!noCount&&invLimitHit()){limitModal('inv');return null}
  if(!S.biz.allowNeg&&!skipStock)for(const l of e.lines){if(l.track&&l.qty>stockOf(l.pid)){toast(t('notEnough',l.name));return null}}
  const inv=buildInv(e,'issued',date);
  S.counter++;inv.number=S.biz.prefix+'-'+String(S.counter).padStart(4,'0');
  putInv(inv);
  if(!inv.counted&&!noCount&&!isAdminView()){S.usage[ym()]=(S.usage[ym()]||0)+1;inv.counted=true}
  inv.lines.filter(l=>l.track).forEach(l=>addMove(l.pid,-l.qty,'sale',inv.id,inv.date));
  save();return inv;
}
ACT.edissue=()=>{const inv=issue(UI.ed);if(!inv)return;S.biz.quick=false;save();UI.ed=null;toast(t('issued',inv.number));go('/app/invoices/'+inv.id)};

function notFound(){return shell({active:'invoices',back:'back',title:t('notFound'),body:empty('file',t('notFound'),'','')})}
const SALT='invoice-dorkar-v1';
function cyrb53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const b64u=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const vCore=p=>[p.n,p.b,p.x,p.d,p.u,p.g,p.t].join('|')+SALT;
function verifyUrl(i){
  const p={n:i.number,b:i.business.name,x:i.business.taxId||'',d:i.date,u:i.business.currency,g:i.grandTotal,t:i.taxTotal};
  p.k=cyrb53(vCore(p));
  const here=String(location.href).split('#')[0],base=(S.biz&&S.biz.verifyBase)||(/^https?:/.test(here)?here:'https://claude.ai/artifact/AECcoHE1oPTULtVz7pTwCC');
  return base+'#/verify?d='+b64u(JSON.stringify(p));
}
function qrSVG(text){
  if(typeof qrcode!=='function')return'';
  try{const q=qrcode(0,'L');q.addData(text);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4},${r+4}h1v1h-1z`;
    return`<svg class="qr" viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(e){return''}
}

<div class="phr"><div class="ptitle">${esc(i.invTitle||t('invoice'))}</div><span class="pno">${i.number?esc(i.number):t('st_draft')}</span></div></div>
<div class="pm"><div><span class="mut">${t('billTo')}</span><b>${esc(c.name)}</b>${c.phone?`<div class="mut">${esc(c.phone)}</div>`:''}${c.address?`<div class="mut">${esc(c.address)}</div>`:''}${c.taxId?`<div class="mut">${esc(c.taxId)}</div>`:''}</div>
<div><span class="mut">${t('date')}</span><b>${fmtDate(i.date)}</b><span class="mut" style="margin-top:6px">${t('due')}</span><b>${fmtDate(i.due)}</b>${i.seller?`<span class="mut" style="margin-top:6px">${t('sellerT')}</span><b>${esc(i.seller.name)}</b>`:''}</div></div>

<div class="ptot"><div class="kv"><span>${t('subtotal')}</span><span>${m(i.subtotal)}</span></div>
${i.discountTotal?`<div class="kv"><span>${t('discount')}</span><span>−${m(i.discountTotal)}</span></div>`:''}

function verifyPage(d){

function pdfFromCanvases(pcs){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const put=d=>{const u=typeof d==='string'?enc.encode(d):d;chunks.push(u);len+=u.length};
  const jp=pcs.map(c=>{const bin=atob(c.toDataURL('image/jpeg',.9).split(',')[1]),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return{u,w:c.width,h:c.height,pw:c.pw||595.28,ph:c.ph||841.89}});
  const N=jp.length,o=(n,body)=>{offs[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n')};
  put('%PDF-1.4\n');
  o(1,'<< /Type /Catalog /Pages 2 0 R >>');
  o(2,'<< /Type /Pages /Kids ['+jp.map((_,k)=>(3+3*k)+' 0 R').join(' ')+'] /Count '+N+' >>');
  jp.forEach((im,k)=>{const pg=3+3*k,ct=4+3*k,ig=5+3*k,cs='q '+im.pw+' 0 0 '+im.ph+' 0 0 cm /Im0 Do Q';
    o(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+im.pw+' '+im.ph+'] /Resources << /XObject << /Im0 '+ig+' 0 R >> >> /Contents '+ct+' 0 R >>');
    o(ct,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[ig]=len;put(ig+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.u.length+' >>\nstream\n');put(im.u);put('\nendstream\nendobj\n');});
  const xr=len,total=3*N+3;let xs='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)xs+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  put(xs+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}

const REP=[['sales',1],['byProduct',1],['byCustomer',1],['aging',0],['payments',1],['tax',1],['expenses',1],['pnl',1],['stockValue',0],['lowStock',0],['moves',1],['posSales',1],['bySeller',1],['posItems',1],['posPay',1]];
const lsOf=iss=>{const a=[];iss.forEach(i=>i.lines.forEach(l=>a.push(Object.assign({},l,{inc:!!i.taxInc}))));return a};
function buildReport(k,r){
  const iss=S.invoices.filter(i=>i.status==='issued'&&inR(i.date,r));
  const grp=(arr,key,init,add)=>{const m={};arr.forEach(x=>{const g=key(x);m[g]=m[g]||init(g);add(m[g],x)});return Object.values(m)};
  switch(k){
  case'sales':return{cols:[['date','d'],['invoices','n'],['subtotal','m'],['discount','m'],['tax','m'],['total','m']],rows:grp(iss,i=>i.date,d=>({d,n:0,s:0,dc:0,tx:0,g:0}),(a,i)=>{a.n++;a.s+=i.subtotal;a.dc+=i.discountTotal;a.tx+=i.taxTotal;a.g+=i.grandTotal}).sort((a,b)=>a.d<b.d?-1:1).map(x=>[x.d,x.n,x.s,x.dc,x.tx,x.g])};
  case'byProduct':{const ls=lsOf(iss);return{cols:[['product','s'],['qty','n'],['amount','m']],rows:grp(ls,l=>l.name,n=>({n,q:0,a:0}),(a,l)=>{a.q+=l.qty;a.a+=l.totalMinor}).sort((a,b)=>b.a-a.a).map(x=>[x.n,x.q,x.a])}}
  case'byCustomer':return{cols:[['customer','s'],['invoices','n'],['total','m']],rows:grp(iss,i=>i.customer.name,n=>({n,c:0,a:0}),(a,i)=>{a.c++;a.a+=i.grandTotal}).sort((a,b)=>b.a-a.a).map(x=>[x.n,x.c,x.a])};
  case'aging':{const td=today();return{cols:[['invoice','s'],['customer','s'],['due','d'],['days','n'],['balance','m'],['bucket','s']],rows:S.invoices.filter(i=>i.status==='issued'&&balOf(i)>0).map(i=>{const dd=i.due?Math.max(0,daysBetween(i.due,td)):0;return[i.number,i.customer.name,i.due,dd,balOf(i),dd<=0?t('current'):dd<=30?'1–30':dd<=60?'31–60':dd<=90?'61–90':'90+']}).sort((a,b)=>b[3]-a[3])}}
  case'payments':return{cols:[['date','d'],['invoice','s'],['customer','s'],['method','s'],['txn','s'],['amount','m']],rows:S.payments.filter(p=>inR(p.date,r)).map(p=>{const i=invById(p.invId);return[p.date,i?i.number:'',i?i.customer.name:'',mLabel(p.method),p.ref||'',p.amount]}).sort((a,b)=>a[0]<b[0]?-1:1)};
  case'tax':{const ls=lsOf(iss);return{cols:[['rate','s'],['taxable','m'],['tax','m']],rows:grp(ls,l=>l.taxBps||0,b=>({b,n:0,x:0}),(a,l)=>{a.n+=l.inc?l.netMinor-l.taxMinor:l.netMinor;a.x+=l.taxMinor}).sort((a,b)=>a.b-b.b).map(x=>[pct(x.b),x.n,x.x])}}
  case'expenses':return{cols:[['category','s'],['count','n'],['amount','m']],rows:grp(S.expenses.filter(e=>inR(e.date,r)),e=>e.cat,c=>({c,n:0,a:0}),(a,e)=>{a.n++;a.a+=e.amount}).sort((a,b)=>b.a-a.a).map(x=>[t('x_'+x.c),x.n,x.a])};
  case'pnl':{const ls=lsOf(iss);const rev=sum(ls,l=>l.inc?l.netMinor-l.taxMinor:l.netMinor),cg=sum(ls,l=>l.qty*(l.costMinor||0)),ex=sum(S.expenses.filter(e=>inR(e.date,r)),e=>e.amount);return{cols:[['item','s'],['amount','m']],rows:[[t('p_rev'),rev],[t('p_cogs'),-cg],[t('p_gross'),rev-cg],[t('p_exp'),-ex],[t('p_net'),rev-cg-ex]]}}
  case'stockValue':return{cols:[['product','s'],['onhand','n'],['cost','m'],['value','m']],rows:S.products.filter(p=>!p.deletedAt&&p.track).map(p=>{const s=stockOf(p.id);return[p.name,s,p.costMinor,s*p.costMinor]})};
  case'lowStock':return{cols:[['product','s'],['onhand','n'],['status','s']],rows:S.products.filter(p=>['low','out'].includes(stockState(p))).sort((a,b)=>stockOf(a.id)-stockOf(b.id)).map(p=>[p.name,stockOf(p.id),stockState(p)==='out'?t('outStock'):t('lowStock')])};
  case'bySeller':{const m={},z=(k,n)=>m[k]=m[k]||{n,ic:0,ia:0,pc:0,pa:0};
    iss.forEach(i=>{const a=z(i.seller?i.seller.id:'-',i.seller?i.seller.name:'—');a.ic++;a.ia+=i.grandTotal});
    S.sales.filter(x=>inR(x.date,r)).forEach(x=>{const a=z(x.seller?x.seller.id:'-',x.seller?x.seller.name:'—');a.pc++;a.pa+=saleNet(x)});
    return{cols:[['seller','s'],['invoices','n'],['invAmt','m'],['posN','n'],['posAmt','m'],['all','m']],rows:Object.values(m).map(a=>[a.n,a.ic,a.ia,a.pc,a.pa,a.ia+a.pa]).sort((a,b)=>b[5]-a[5])}}
  case'posSales':{const ss=S.sales.filter(x=>inR(x.date,r));return{cols:[['date','d'],['count','n'],['subtotal','m'],['discount','m'],['tax','m'],['total','m'],['refunds','m'],['net','m']],rows:grp(ss,x=>x.date,d=>({d,n:0,s:0,dc:0,tx:0,g:0,rf:0}),(a,x)=>{a.n++;a.s+=x.subtotal;a.dc+=x.discountTotal;a.tx+=x.taxTotal;a.g+=x.grandTotal;a.rf+=sum(x.refunds||[],y=>y.amount)}).sort((a,b)=>a.d<b.d?-1:1).map(x=>[x.d,x.n,x.s,x.dc,x.tx,x.g,x.rf,x.g-x.rf])}}
  case'posItems':{const ls=[];S.sales.filter(x=>inR(x.date,r)).forEach(x=>x.lines.forEach(l=>ls.push(l)));return{cols:[['product','s'],['qty','n'],['amount','m']],rows:grp(ls,l=>l.name,n=>({n,q:0,a:0}),(a,l)=>{a.q+=l.qty-(l.ret||0);a.a+=l.totalMinor-(l.refAmt||0)}).sort((a,b)=>b.a-a.a).map(x=>[x.n,x.q,x.a])}}
  case'posPay':{const m={},z=k=>m[k]=m[k]||{r:0,f:0};S.sales.filter(x=>inR(x.date,r)).forEach(x=>{x.payments.forEach(p=>{z(p.method).r+=p.amount});(x.refunds||[]).forEach(f=>{z(f.method).f+=f.amount})});return{cols:[['method','s'],['amount','m'],['refunds','m'],['net','m']],rows:Object.keys(m).map(k=>[mLabel(k),m[k].r,m[k].f,m[k].r-m[k].f])}}
  case'moves':return{cols:[['date','d'],['product','s'],['reason','s'],['change','n']],rows:S.moves.filter(m=>inR(m.date,r)).sort((a,b)=>a.date===b.date?a.ts-b.ts:(a.date<b.date?-1:1)).map(m=>{const p=S.products.find(x=>x.id===m.pid);return[m.date,p?p.name:'',t('mv_'+m.reason),m.delta]})};
  }
  return{cols:[],rows:[]};
}

/* ---------- sample data ---------- */
ACT.sample=()=>{
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,e=Math.pow(10,exp(cur()));
  const cs=['Rahim Traders','Nila Enterprise','Karim Store'].map(n=>{const c={id:uid(),name:n,phone:'',address:'',taxId:'',created:Date.now()};S.customers.push(c);return c});
  const ps=[['Rice 5 kg','RICE-5',680,520,'bag',150],['Cooking oil 1 L','OIL-1',190,160,'bottle',150],['Sugar 1 kg','SUG-1',125,105,'pack',150],['Tea 500 g','TEA-500',240,190,'pack',150],['Notebook A5','NB-A5',60,40,'pcs',150],['Soap bar','SOAP',75,55,'pcs',22],['Salt 1 kg','SALT-1',40,30,'pack',4],['Candle','CND-1',30,20,'pcs',0]].map(a=>{const p={id:uid(),name:a[0],sku:a[1],unit:a[4],priceMinor:a[2]*e,costMinor:a[3]*e,taxBps:null,track:true,reorder:20,created:Date.now()};S.products.push(p);addMove(p.id,a[5],'opening',p.id,addDays(today(),-30));return p});
  const dates=[];for(let k=0;k<14;k++)dates.push(addDays(today(),-Math.floor(rnd()*28)));dates.sort();
  dates.forEach(date=>{
    const c=cs[Math.floor(rnd()*cs.length)],n=1+Math.floor(rnd()*3),used={},lines=[];
    for(let k=0;k<n;k++){const p=ps[Math.floor(rnd()*6)];if(used[p.id])continue;used[p.id]=1;lines.push({pid:p.id,name:p.name,sku:p.sku,unit:p.unit,qty:1+Math.floor(rnd()*4),priceMinor:p.priceMinor,costMinor:p.costMinor,taxBps:S.biz.taxBps,track:true})}
    const inv=issue({id:null,cust:c.id,lines,dt:'fix',dv:'',notes:'',due:addDays(date,S.biz.dueDays)},date,true,true);if(!inv)return;
    const r=rnd();if(r<.5)S.payments.push({id:uid(),invId:inv.id,amount:inv.grandTotal,method:'cash',date,note:''});else if(r<.7)S.payments.push({id:uid(),invId:inv.id,amount:Math.floor(inv.grandTotal*.4),method:'bank',date,note:''});
  });
  save();toast(t('sampleAdded'));render();
};

/* ---------- language picker + AI translation ---------- */
const TR_PROMPT=(name,obj)=>'Translate the values of this JSON object from English into '+name+'. It is the user interface text of an invoicing and point-of-sale app. Rules: keep every key exactly as it is; keep placeholders such as {0}, {1}, {2} exactly as they are; keep brand and technical names unchanged (Invoice Dorkar, POS, PDF, QR, WhatsApp, Telegram, SMS, VAT, GST, SKU, Pro, Pro+); keep symbols, emoji and punctuation such as … and —; keep every label short and natural for a mobile app. Return only the JSON object, nothing else.\n'+JSON.stringify(obj);
async function translateLang(code,onProg){
  const sm=await SMP;if(!sm||typeof sm.json!=='function')return'na';
  loadPack(code);const miss=missingKeys(code);if(!miss.length)return'ok';
  const name=langName(code,'en')+' ('+nativeName(code)+')',chunks=[];
  for(let i=0;i<miss.length;i+=40)chunks.push(miss.slice(i,i+40));
  let done=0,idx=0,denied=false;
  const worker=async()=>{
    while(idx<chunks.length&&!denied){
      const ch=chunks[idx++],obj={};ch.forEach(k=>{obj[k]=T.en[k]});
      for(let a=0;a<2;a++){
        try{
          const r=await sm.json(TR_PROMPT(name,obj),{modelTier:'quick'});
          if(r&&typeof r==='object')ch.forEach(k=>{if(typeof r[k]==='string'&&r[k].trim())T[code][k]=r[k]});
          break;
        }catch(e){
          if(e&&e.code==='not_granted'){denied=true;break}
          if(e&&e.code==='rate_limited'&&a===0)await new Promise(z=>setTimeout(z,2500));
        }
      }
      done+=ch.length;savePack(code);if(onProg)onProg(Math.min(done,miss.length),miss.length);
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  return denied?'denied':(missingKeys(code).length?'partial':'ok');
}
function langRows(q){
  q=(q||'').trim().toLowerCase();
  const l=LANGS.map(c=>({c,n:nativeName(c),e:langName(c,'en')})).filter(x=>!q||x.n.toLowerCase().includes(q)||x.e.toLowerCase().includes(q)||x.c.toLowerCase()===q);
  l.sort((a,b)=>a.e.localeCompare(b.e));
  const built=c=>c==='en'||c==='bn';
  let saved=c=>{try{return !!localStorage.getItem(PK+c)}catch(e){return false}};
  return l.map(x=>`<button class="row" data-act="setlang" data-c="${x.c}"><span class="r1"><b>${esc(x.n)}</b><span class="mut">${esc(x.e)}</span></span><span class="r2">${x.c===S.lang?'<b>✓</b>':(built(x.c)||saved(x.c))?'':'<span class="chip pri">AI</span>'}</span></button>`).join('')||`<p class="mut">${t('noData')}</p>`;
}

/* ---------- POS ---------- */
const openShift=()=>S.shifts.find(s=>!s.closed);
const saleById=id=>S.sales.find(x=>x.id===id);
const cartN=()=>UI.cart||(UI.cart={lines:[],dt:'fix',dv:'',cust:'',q:'',cat:''});
const cartK=()=>{const c=cartN();return calc(c.lines,discOf(c),S.biz.taxInc)};
const timeStr=ts=>{try{return new Date(ts).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const saleStatus=s=>{const n=sum(s.lines,l=>l.qty),r=sum(s.lines,l=>l.ret||0);return r===0?'paid':r>=n?'refunded':'partial'};
const schip=st=>`<span class="chip ${({paid:'ok',partial:'warn',refunded:'muted'})[st]}">${t(({paid:'st_paid',partial:'st_partialref',refunded:'st_refunded'})[st])}</span>`;
const saleNet=s=>s.grandTotal-sum(s.refunds||[],r=>r.amount);
function posTabs(a){
  return`<div class="tabs" role="tablist">${[['sell','posSell',''],['sales','posSalesT','/sales'],['register','posRegister','/register']].map(x=>`<button class="tab${a===x[0]?' on':''}" role="tab" data-act="go" data-to="/app/pos${x[2]}">${t(x[1])}${x[0]==='register'&&openShift()?' ●':''}</button>`).join('')}</div>`;
}
function tiles(){
  const c=cartN(),q=c.q.trim().toLowerCase(),all=S.products.filter(p=>!p.deletedAt);
  if(!all.length)return empty('box',t('noProducts'),t('noProductsP'),`<button class="btn primary" data-act="addprod">${ico('plus')}${t('addProduct')}</button>`);
  return all.filter(p=>(!c.cat||p.cat===c.cat)&&(!q||p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)||(p.barcode||'').toLowerCase().includes(q))).map(p=>{
    const st=p.track?stockOf(p.id):null,out=p.track&&st<=0&&!S.biz.allowNeg;
    return`<button class="tile" data-act="padd" data-id="${p.id}"${out?' disabled':''}>${p.img?`<img class="pt" src="${esc(p.img)}" alt="">`:`<span class="pt">${ico('box')}</span>`}<b>${esc(p.name)}</b><span>${money(p.priceMinor)}</span>${p.track?`<small class="${out?'bad-t':(st<=lowAt()?'warn-t2':'mut')}">${st} ${esc(p.unit)}</small>`:''}</button>`;
  }).join('');
}

}

<label class="fld" style="margin-top:10px"><span>${t('customer')}</span><select data-ch="pcust">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]===c.cust?' selected':''}>${esc(o[1])}</option>`).join('')}</select></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><select data-ch="pdt" aria-label="${t('discount')}"><option value="fix"${c.dt!=='pct'?' selected':''}>${t('discFix')}</option><option value="pct"${c.dt==='pct'?' selected':''}>${t('discPct')}</option></select><input type="text" inputmode="decimal" data-in="pdv" placeholder="${t('discount')}" value="${esc(c.dv)}" aria-label="${t('discount')}"></div>

function addToCart(p){
  const c=cartN();let l=c.lines.find(x=>x.pid===p.id);const q=(l?l.qty:0)+1;
  if(p.track&&!S.biz.allowNeg&&q>stockOf(p.id)){toast(t('notEnough',p.name));return false}
  if(!l){l={pid:p.id,name:p.name,sku:p.sku||'',unit:p.unit,qty:0,priceMinor:p.priceMinor,costMinor:p.costMinor,taxBps:p.taxBps!=null?p.taxBps:S.biz.taxBps,track:!!p.track,dt:'fix',dv:''};c.lines.push(l)}
  l.qty=q;return true;
}

function posScan(code,quiet){

  if(addToCart(p)){cartN().q='';const i=document.querySelector('input[data-in="posq"]');if(i)i.value='';const a=$('#ptiles');if(a)a.innerHTML=tiles();paintCart();toast(t('scanAdded',p.name))}
  return true;
}

/* payment */
function payState(){const k=cartK(),paid=sum(UI.pay.pays,p=>p.amount);return{k,paid,rem:k.grandTotal-paid}}
function payModal(){
  const {k,paid,rem}=payState(),P=UI.pay,cashPaid=sum(P.pays.filter(p=>p.method==='cash'),p=>p.amount),change=paid>k.grandTotal?paid-k.grandTotal:0,ok=rem<=0&&change<=cashPaid;
  const e=Math.pow(10,exp(cur())),sug=[];if(rem>0){sug.push(rem);[10,50,100,500,1000].forEach(u=>{const v=Math.ceil(rem/(u*e))*u*e;if(v>rem&&sug.indexOf(v)<0&&sug.length<4)sug.push(v)})}
  $('#modal').innerHTML=`<div class="ov" data-act="ovclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="${t('payment')}"><div class="sh-h"><h2>${t('payment')}</h2><button class="ib" data-act="pcancel" aria-label="${t('close')}">${ico('x')}</button></div><div class="sh-b">
<div class="kv tot" style="margin:0 0 8px;border:0;padding:0"><span>${t('total')}</span><span>${money(k.grandTotal)}</span></div>
${P.pays.map((p,i)=>`<div class="kv"><span>${esc(mLabel(p.method))}${p.ref?' · '+esc(p.ref):''}</span><span>${money(p.amount)} <button class="ib" data-act="pdelpay" data-i="${i}" aria-label="${t('delete')}">${ico('x')}</button></span></div>`).join('')}
<div class="kv"><b>${change>0?t('changeDue'):t('remaining')}</b><b class="${change>0?'':'bad-t'}">${money(change>0?change:Math.max(rem,0))}</b></div>
${rem>0?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><select id="pm" data-ch="pmethod" aria-label="${t('method')}">${pmethods().map(m=>`<option value="${esc(m)}"${P.m===m?' selected':''}>${esc(mLabel(m))}</option>`).join('')}</select><input id="pa" inputmode="decimal" value="${fromMinor(rem)}" aria-label="${t('amount')}"></div>
<input id="pr" style="margin-top:8px" placeholder="${t('txn')}" aria-label="${t('txn')}"><div class="btnrow" style="margin:8px 0 0"><button class="btn sm primary" data-act="paddpay">${t('addPayment')}</button>${sug.map(v=>`<button class="btn sm" data-act="pquick" data-a="${v}">${v===rem?t('exact'):money(v)}</button>`).join('')}</div>`:''}
</div><div class="sh-f"><button class="btn" data-act="pcancel">${t('cancel')}</button><button class="btn primary" data-act="pfinish"${ok?'':' disabled'}>${t('complete')}</button></div></div></div>`;
}
ACT.ppay=()=>{const c=cartN();if(!c.lines.length){toast(t('addItems'));return}if(!openShift()){toast(t('regClosed'));go('/app/pos/register');return}UI.pay={pays:[],m:'cash'};payModal()};
ACT.pcancel=()=>{UI.pay=null;closeModal()};
CH.pmethod=v=>{UI.pay.m=v};
ACT.paddpay=()=>{
  const {rem}=payState(),m=$('#pm').value,a=toMinor($('#pa').value),ref=($('#pr').value||'').trim();
  if(a<=0){toast(t('badAmount'));return}
  if(m!=='cash'&&a>rem){toast(t('badAmount'));return}
  UI.pay.m=m;UI.pay.pays.push({method:m,amount:a,ref});payModal();
};
ACT.pquick=d=>{UI.pay.pays.push({method:'cash',amount:+d.a,ref:''});payModal()};
ACT.pdelpay=d=>{UI.pay.pays.splice(+d.i,1);payModal()};
function makeSale(){
  const c=cartN(),{k,paid}=payState(),sh=openShift(),b=S.biz,cu=S.customers.find(x=>x.id===c.cust);
  let change=Math.max(0,paid-k.grandTotal),rest=change;
  const pays=UI.pay.pays.map(p=>Object.assign({},p));
  for(let i=pays.length-1;i>=0&&rest>0;i--){if(pays[i].method==='cash'){const cut=Math.min(pays[i].amount,rest);pays[i].amount-=cut;rest-=cut}}
  S.posCounter++;
  const sale={id:uid(),no:'POS-'+String(S.posCounter).padStart(4,'0'),ts:Date.now(),date:today(),shiftId:sh.id,
    lines:k.lines.map(l=>({pid:l.pid,name:l.name,sku:l.sku,unit:l.unit,qty:l.qty,priceMinor:l.priceMinor,costMinor:l.costMinor,taxBps:l.taxBps,track:l.track,dt:l.dt||'fix',dv:l.dv||'',discMinor:l.discMinor,netMinor:l.netMinor,taxMinor:l.taxMinor,totalMinor:l.totalMinor,ret:0,refAmt:0})),
    dt:c.dt,dv:c.dv,subtotal:k.subtotal,discountTotal:k.discountTotal,taxTotal:k.taxTotal,grandTotal:k.grandTotal,taxInc:!!b.taxInc,taxName:b.taxName||'Tax',
    customer:cu?{id:cu.id,name:cu.name,phone:cu.phone||''}:{id:'',name:t('walkin'),phone:''},
    payments:pays.filter(p=>p.amount>0),tendered:paid,change,refunds:[],
    business:{name:b.name||t('myBiz'),address:b.address||'',phone:b.phone||'',taxId:b.taxId||'',taxIdLabel:b.taxIdLabel||t('taxId'),logo:b.logo||'',footer:b.footer||'',currency:b.currency,country:b.country},
    seller:sellerRef(),cashier:(curSeller()||{}).name||''};
  S.sales.push(sale);
  sale.lines.filter(l=>l.track).forEach(l=>addMove(l.pid,-l.qty,'sale',sale.id,sale.date));
  return sale;
}
ACT.pfinish=()=>{
  const {k,paid,rem}=payState(),cashPaid=sum(UI.pay.pays.filter(p=>p.method==='cash'),p=>p.amount);
  if(rem>0||(paid-k.grandTotal)>cashPaid){toast(t('badAmount'));return}
  if(!S.biz.allowNeg)for(const l of cartN().lines){if(l.track&&l.qty>stockOf(l.pid)){toast(t('notEnough',l.name));return}}
  const s=makeSale();UI.cart=null;UI.pay=null;save();closeModal();toast(t('saleDone',s.no));go('/app/pos/receipt/'+s.id);
};

async function receiptCanvas(s){

function shiftStats(sh){
  const ss=S.sales.filter(x=>x.shiftId===sh.id),by={};let cashSales=0;
  ss.forEach(x=>x.payments.forEach(p=>{by[p.method]=(by[p.method]||0)+p.amount;if(p.method==='cash')cashSales+=p.amount}));
  const rf=[];S.sales.forEach(x=>(x.refunds||[]).forEach(r=>{if(r.shiftId===sh.id)rf.push(r)}));
  const refunds=sum(rf,r=>r.amount),refCash=sum(rf.filter(r=>r.method==='cash'),r=>r.amount);

}

let ZXP=null;
const ZX_URLS=['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js'];
function loadZX(){
  if(ZXP)return ZXP;
  ZXP=new Promise((res,rej)=>{
    if(typeof window!=='undefined'&&window.ZXing)return res(window.ZXing);
    let i=0;const next=()=>{if(i>=ZX_URLS.length)return rej(new Error('zxing'));const sc=document.createElement('script');sc.src=ZX_URLS[i++];sc.onload=()=>window.ZXing?res(window.ZXing):next();sc.onerror=next;document.head.appendChild(sc)};next();
  });
  ZXP.catch(()=>{ZXP=null});
  return ZXP;
}
const findByCode=code=>{const q=String(code==null?'':code).trim().toLowerCase();if(!q)return null;return S.products.find(x=>!x.deletedAt&&((x.barcode||'').toLowerCase()===q||(x.sku||'').toLowerCase()===q))||null};
const scanMsg=(m,bad)=>{const e=$('#scanmsg');if(e){e.textContent=m;if(e.style)e.style.color=bad?'var(--bad)':''}};
function scanUI(){
  return`<div class="ov" style="z-index:55"><div class="sheet" role="dialog" aria-modal="true" aria-label="${t('scanT')}"><div class="sh-h"><h2>${t('scanT')}</h2><button class="ib" data-act="scanclose" aria-label="${t('close')}">${ico('x')}</button></div><div class="sh-b">
<div class="scanbox"><video id="scanv" playsinline muted autoplay style="display:none"></video><div id="scanspin" class="scanspin" aria-hidden="true"></div></div>
<p id="scanmsg" class="mut" style="margin:10px 0;text-align:center" aria-live="polite">${t('scanStarting')}</p>
<div id="scanfallback" hidden><label class="btn block" style="margin-bottom:10px">${ico('img')}${t('scanPhoto')}<input type="file" accept="image/*" capture="environment" id="scanfile" data-ch="scanphoto" hidden></label></div>
<div class="scanman"><label for="scanman">${t('scanType')}</label><div class="scanman-row"><input id="scanman" data-enter="scanman" autocomplete="off" inputmode="text"><button class="btn" data-act="scanuse">${t('scanUse')}</button></div></div>
</div>
<div class="sh-f"><button class="btn primary block" data-act="scanclose">${t('scanDone')}</button></div></div></div>`;
}
function openScan(cb,cont){
  closeScan();SC.cb=cb;SC.cont=!!cont;SC.last='';SC.lastT=0;SC.on=true;
  $('#modal2').innerHTML=scanUI();startLive();
}
function closeScan(){SC.on=false;if(SC.stream){try{SC.stream.getTracks().forEach(x=>x.stop())}catch(e){}SC.stream=null}const m=$('#modal2');if(m)m.innerHTML=''}
ACT.scanclose=()=>closeScan();
function showScanFallback(){const e=$('#scanfallback');if(e)e.hidden=false}
function scanGot(code,manual){
  code=String(code||'').trim();if(!code||!SC.on)return;
  const now=Date.now();if(!manual&&code===SC.last&&now-SC.lastT<1800)return;SC.last=code;SC.lastT=now;
  const r=SC.cb?SC.cb(code):true;
  if(r===false){toast(t('scanNone2',code));return}
  if(!SC.cont){closeScan();return}
  toast(typeof r==='string'?r:t('scanAdded',''));
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
}
ACT.scanuse=()=>{const i=$('#scanman');scanGot(i&&i.value,true);if(i&&SC.on&&SC.cont)i.value=''};
ENT.scanman=v=>{scanGot(v,true);const i=$('#scanman');if(i&&SC.on&&SC.cont)i.value=''};
async function decodeImageFile(file){
  if(typeof BarcodeDetector!=='undefined'&&typeof createImageBitmap==='function'){
    try{const bmp=await createImageBitmap(file);const r=await new BarcodeDetector().detect(bmp);if(r&&r.length)return r[0].rawValue}catch(e){}
  }
  const url=URL.createObjectURL(file);
  try{const ZX=await loadZX();const res=await new ZX.BrowserMultiFormatReader().decodeFromImageUrl(url);return res.getText()}
  finally{URL.revokeObjectURL(url)}
}
CH.scanphoto=async(v,el)=>{
  const f=el.files&&el.files[0];if(!f)return;
  scanMsg(t('scanBusy'));let code=null;
  try{code=await decodeImageFile(f)}catch(e){}
  try{el.value=''}catch(e){}
  if(!SC.on)return;
  if(code)scanGot(code,true);else scanMsg(t('scanFail'),true);
};
const WANT_FORMATS=['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','data_matrix','pdf417','aztec'];
let DET_FMTS=null,DET_FMTS_TRIED=false;
async function detFormats(){
  if(DET_FMTS_TRIED)return DET_FMTS;
  DET_FMTS_TRIED=true;
  try{
    if(typeof BarcodeDetector!=='undefined'&&typeof BarcodeDetector.getSupportedFormats==='function'){
      const sup=await BarcodeDetector.getSupportedFormats();
      const use=WANT_FORMATS.filter(f=>sup.indexOf(f)>-1);
      if(use.length)DET_FMTS=use;
    }
  }catch(e){}
  return DET_FMTS;
}
async function makeDetector(){
  if(typeof BarcodeDetector==='undefined')return null;
  try{const f=await detFormats();return f?new BarcodeDetector({formats:f}):new BarcodeDetector()}
  catch(e){try{return new BarcodeDetector()}catch(e2){return null}}
}
async function enableContinuousFocus(stream){
  try{
    const track=stream.getVideoTracks()[0],caps=track&&track.getCapabilities?track.getCapabilities():null;
    if(caps&&caps.focusMode&&caps.focusMode.indexOf('continuous')>-1)await track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  }catch(e){}
}
async function startLive(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanMsg(t('scanNoLive'));showScanFallback();return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){if(SC.on){scanMsg(t('scanNoLive'));showScanFallback()}return}
  if(!SC.on||!$('#scanv')){stream.getTracks().forEach(x=>x.stop());return}
  SC.stream=stream;const v=$('#scanv');v.srcObject=stream;try{await v.play()}catch(e){}v.style.display='block';const sp=$('#scanspin');if(sp)sp.style.display='none';
  enableContinuousFocus(stream);
  let det=await makeDetector(),rd=null;
  if(!det){try{const ZX=await loadZX();rd=new ZX.BrowserMultiFormatReader()}catch(e){if(SC.on){scanMsg(t('scanNoLive'));showScanFallback()}stream.getTracks().forEach(x=>x.stop());return}}
  scanMsg(t('scanPoint'));
  const cv=document.createElement('canvas');const startedAt=Date.now();let hinted=false;
  while(SC.on&&SC.stream===stream&&$('#scanv')){
    let code=null;
    if(v.readyState>=2&&v.videoWidth){
      try{
        if(det){const r=await det.detect(v);if(r&&r.length)code=r[0].rawValue}
        else if(rd){cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);try{const r=await rd.decodeFromImageUrl(cv.toDataURL('image/jpeg',.85));code=r.getText()}catch(e){}}
      }catch(e){
        if(det){det=null;if(!rd){try{const ZX=await loadZX();rd=new ZX.BrowserMultiFormatReader()}catch(e2){}}}
      }
    }
    if(code)scanGot(code);
    else if(!hinted&&Date.now()-startedAt>6000){hinted=true;scanMsg(t('scanHint'))}
    await new Promise(r=>setTimeout(r,det?130:260));
  }
  stream.getTracks().forEach(x=>x.stop());
}
ACT.scanfield=d=>openScan(code=>{const el=document.querySelector('#mform [name="'+d.target+'"]');if(el)el.value=code;return true},false);
ACT.pscan=()=>openScan(code=>{const p=findByCode(code);if(!p)return false;if(!addToCart(p))return t('notEnough',p.name);paintCart();return t('scanAdded',p.name)},true);
ACT.edscan=()=>openScan(code=>{const p=findByCode(code);if(!p)return false;ACT.edqty({id:p.id,d:'1'});return t('scanAdded',p.name)},true);
ENT.edq=v=>{const p=findByCode(v);if(!p)return;ACT.edqty({id:p.id,d:'1'});UI.ed.q='';const i=document.querySelector('input[data-in="edq"]');if(i)i.value='';const a=$('#edlist');if(a)a.innerHTML=edList()};

/* ---------- router ---------- */
function appRoute(s){
  const a=s[0]||'dashboard',b=s[1],c=s[2];
  switch(a){
    case'dashboard':return dashboard();
    case'invoices':if(b==='new')return editor();if(b&&c==='edit')return editor(b);return b?invoiceDetail(b):invoices();
    case'products':return b?productDetail(b):products();
    case'customers':return b?customerDetail(b):customers();
    case'expenses':return expenses();
    case'reports':return b?reportView(b):reports();
    case'pos':return b==='sales'?posSales():b==='register'?posRegister():b==='receipt'?receiptView(c):pos();
    case'stock':return stockPage(b);
    case'sellers':return curSeller()&&!UI.ownerOK&&!isAdminView()?ownerLock():sellersPage();
    case'settings':return curSeller()&&!UI.ownerOK&&!isAdminView()?ownerLock():settings();
    case'more':return more();
    default:return dashboard();
  }
}
function render(top){
  const seg=(location.hash||'#/').slice(1).split('?')[0].split('/').filter(Boolean),u=curUser(),adm=!!(ROOT.session&&ROOT.session.admin);
  applyLangEnv(S.lang);loadPack(S.lang);
  let h;
  if(seg[0]==='verify')h=verifyPage(new URLSearchParams((location.hash.split('?')[1])||'').get('d'));
  else if(seg[0]==='admin')h=adminPage();
  else if(seg[0]==='login'||seg[0]==='signup'){if(u){go('/app/dashboard');return}h=authPage(seg[0])}
  else if(seg[0]==='app'){if(adm){go('/admin');return}h=!u?authPage('login'):(!S.biz?onboarding():appRoute(seg.slice(1)))}
  else h=landing();
  $('#root').innerHTML=h;
  if(top===true)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{closeScan();closeModal();render(true)});
render();
wireAuth();
</script>
